<svg viewBox="0 0 1600 860" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Inter','SF Pro Display',-apple-system,sans-serif; }
    .stg-lbl { font-size:13px; font-weight:700; letter-spacing:1.5px; }
    .ttl { font-size:18px; font-weight:700; fill:#0F172A; }
    .sub { font-size:13px; font-weight:500; fill:#64748B; }
    .bdg-txt { font-size:13px; font-weight:700; fill:#FFF; }
    .box-txt { font-size:13px; font-weight:600; fill:#334155; }
    .det { font-size:12px; fill:#475569; }
    .det-b { font-size:12px; font-weight:600; fill:#0F172A; }
    .callout-em { font-size:13px; font-weight:700; fill:#0F172A; }
    .callout { font-size:12px; fill:#475569; line-height: 1.4; }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" fill="#16A34A"/></marker>
    <marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" fill="#4F46E5"/></marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" fill="#DC2626"/></marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" fill="#64748B"/></marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1L10 5L0 9z" fill="#8B5CF6"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="860" fill="#F8FAFC"/>

  <!-- Title -->
  <text x="800" y="35" text-anchor="middle" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Neuro-Symbolic Cognitive Pipeline</text>
  <text x="800" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#64748B">The 5-stage dual-path loop driving autonomous spatial agents</text>

  <!-- ══════════════ STAGE LABELS ══════════════ -->
  <text x="140" y="100" text-anchor="middle" class="stg-lbl" fill="#0EA5E9">STAGE 1</text>
  <text x="420" y="100" text-anchor="middle" class="stg-lbl" fill="#16A34A">STAGE 2a</text>
  <text x="420" y="275" text-anchor="middle" class="stg-lbl" fill="#4F46E5">STAGE 2b</text>
  <text x="680" y="275" text-anchor="middle" class="stg-lbl" fill="#4F46E5">STAGE 3</text>
  <text x="940" y="275" text-anchor="middle" class="stg-lbl" fill="#059669">STAGE 4</text>
  <text x="1220" y="100" text-anchor="middle" class="stg-lbl" fill="#F59E0B">STAGE 5</text>

  <!-- ══════════════ STAGE 1: PERCEPTION ══════════════ -->
  <rect x="40" y="115" width="200" height="290" rx="16" fill="#F0F9FF" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
  <text x="140" y="150" text-anchor="middle" class="ttl">Perception</text>
  <text x="140" y="170" text-anchor="middle" class="sub">SensorySystem</text>
  
  <!-- Perception Visual -->
  <path d="M 140 220 L 90 270 A 70 70 0 0 0 190 270 Z" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="140" cy="220" r="6" fill="#0EA5E9"/>
  <text x="140" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#0284C7">126° FOV Cone</text>
  <text x="140" y="340" text-anchor="middle" class="det-b">• Physical Line-of-Sight</text>
  <text x="140" y="360" text-anchor="middle" class="det-b">• Walls Block Vision</text>
  <text x="140" y="380" text-anchor="middle" class="det-b">• Hearing Events</text>

  <!-- Novelty Badge 1 -->
  <circle cx="240" cy="115" r="14" fill="#0EA5E9"/>
  <text x="240" y="120" text-anchor="middle" class="bdg-txt">1</text>

  <!-- Fork arrows -->
  <line x1="240" y1="180" x2="300" y2="180" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="270" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#16A34A">fast</text>
  
  <line x1="240" y1="360" x2="300" y2="360" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arr-b)"/>
  <text x="270" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#4F46E5">slow</text>

  <!-- ══════════════ STAGE 2a: SUBCONSCIOUS ══════════════ -->
  <rect x="310" y="115" width="220" height="130" rx="16" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="150" text-anchor="middle" class="ttl">Subconscious</text>
  <text x="400" y="170" text-anchor="middle" class="sub">UtilityBrain</text>

  <!-- Novelty Badge 4 — inside top-right of card, clear of title -->
  <circle cx="510" cy="143" r="13" fill="#16A34A"/>
  <text x="510" y="148" text-anchor="middle" class="bdg-txt">4</text>

  <rect x="330" y="185" width="180" height="40" rx="8" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="420" y="208" text-anchor="middle" class="box-txt" fill="#16A34A">Drive Urgency Evaluation</text>

  <!-- Stat line below chip, inside card -->
  <text x="420" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">60fps · No LLM calls</text>

  <!-- Subconscious -> Task Exec arrow -->
  <line x1="530" y1="160" x2="1090" y2="160" stroke="#16A34A" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr-g)"/>
  <text x="810" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#15803D">Fallback Actions (Idle, Wander, Sit)</text>

  <!-- ══════════════ STAGE 2b: CONTEXT MIXER ══════════════ -->
  <rect x="310" y="290" width="220" height="175" rx="16" fill="#FFF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="325" text-anchor="middle" class="ttl">Context Mixer</text>
  <text x="420" y="345" text-anchor="middle" class="sub">agent-brain.ts</text>

  <!-- Reduced Data Chips -->
  <rect x="330" y="360" width="180" height="28" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="420" y="379" text-anchor="middle" class="box-txt">Agent State &amp; Drives</text>

  <rect x="330" y="396" width="180" height="28" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
  <text x="420" y="415" text-anchor="middle" class="box-txt">Filtered Spatial Context</text>

  <rect x="330" y="432" width="180" height="16" rx="4" fill="#F8FAFC"/>
  <text x="420" y="444" text-anchor="middle" font-size="10" fill="#64748B">+ Actively Retrieved Memories</text>

  <line x1="530" y1="360" x2="570" y2="360" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="550" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#4F46E5">prompt</text>

  <!-- ══════════════ STAGE 3: LLM REASONING ══════════════ -->
  <rect x="580" y="290" width="200" height="175" rx="16" fill="#FFF" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
  <text x="660" y="325" text-anchor="middle" class="ttl">LLM Reasoning</text>
  <text x="660" y="345" text-anchor="middle" class="sub">ClientBrain</text>

  <!-- Rate limit badge — inside top-right, clear of title -->
  <rect x="740" y="298" width="30" height="16" rx="8" fill="#EEF2FF"/>
  <text x="755" y="311" text-anchor="middle" font-size="9" font-weight="700" fill="#4F46E5">≤8/m</text>

  <rect x="600" y="362" width="160" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="680" y="385" text-anchor="middle" class="box-txt">Web Worker Inference</text>

  <rect x="600" y="408" width="160" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="680" y="431" text-anchor="middle" class="box-txt">Tool Call Parsing</text>

  <line x1="780" y1="362" x2="820" y2="362" stroke="#4F46E5" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="800" y="354" text-anchor="middle" font-size="11" font-weight="600" fill="#4F46E5">tools</text>

  <!-- ══════════════ STAGE 4: VERIFICATION ══════════════ -->
  <rect x="830" y="290" width="220" height="175" rx="16" fill="#F0FDF4" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>

  <!-- Novelty Badge 2 — inside card top-right, not on border -->
  <circle cx="1033" cy="310" r="13" fill="#059669"/>
  <text x="1033" y="315" text-anchor="middle" class="bdg-txt">2</text>

  <text x="910" y="323" text-anchor="middle" class="ttl">Verification</text>
  <text x="910" y="341" text-anchor="middle" class="sub">Critic Loop</text>

  <text x="850" y="368" class="det-b" fill="#065F46">Spatially Validates:</text>
  <text x="850" y="388" class="det" fill="#065F46">✓ Target entities exist in perception</text>
  <text x="850" y="408" class="det" fill="#065F46">✓ Navigation coordinates valid</text>
  <text x="850" y="428" class="det" fill="#065F46">✓ Preconditions (e.g. object not held)</text>

  <!-- Success arrow to Execution -->
  <line x1="1050" y1="355" x2="1090" y2="355" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="1070" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">valid</text>

  <!-- Critic Loop Error Arrow back to LLM -->
  <path d="M 940 465 Q 940 500 880 500 L 680 500 Q 620 500 620 465" fill="none" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arr-r)"/>
  <rect x="710" y="490" width="160" height="20" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="790" y="504" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">CRITIC RETRY LOOP</text>

  <!-- ══════════════ STAGE 5: TASK EXECUTION ══════════════ -->
  <rect x="1100" y="115" width="240" height="300" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="1220" y="150" text-anchor="middle" class="ttl">Task Execution</text>
  <text x="1220" y="170" text-anchor="middle" class="sub">AgentTaskQueue</text>

  <!-- Phase Machine -->
  <rect x="1120" y="190" width="200" height="50" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
  <text x="1220" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#B45309">Engine Phase Machine</text>
  <text x="1220" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">IDLE → NAV → ACT</text>

  <!-- Simplified Execution Mechanisms -->
  <text x="1130" y="270" class="det-b" fill="#92400E">Physical Integration:</text>
  <text x="1130" y="290" class="det" fill="#92400E">• A* Navigation Mesh</text>
  <text x="1130" y="310" class="det" fill="#92400E">• Rapier Physics Control</text>

  <!-- Simplified Action Categories -->
  <text x="1130" y="340" class="det-b" fill="#92400E">18 Actions categorized:</text>
  <rect x="1130" y="350" width="60" height="24" rx="4" fill="#FFF" stroke="#FDE68A" stroke-width="1"/>
  <text x="1160" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#B45309">Move</text>
  
  <rect x="1195" y="350" width="60" height="24" rx="4" fill="#FFF" stroke="#FDE68A" stroke-width="1"/>
  <text x="1225" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#B45309">Socialize</text>
  
  <rect x="1260" y="350" width="60" height="24" rx="4" fill="#FFF" stroke="#FDE68A" stroke-width="1"/>
  <text x="1290" y="366" text-anchor="middle" font-size="11" font-weight="600" fill="#B45309">Interact</text>

  <!-- ══════════════ 3D WORLD ══════════════ -->
  <rect x="1410" y="200" width="140" height="130" rx="16" fill="#1E293B"/>
  <text x="1480" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#F8FAFC">3D Engine</text>
  <text x="1480" y="265" text-anchor="middle" font-size="12" fill="#94A3B8">Simulation state</text>
  <text x="1480" y="285" text-anchor="middle" font-size="12" fill="#94A3B8">is updated</text>

  <!-- Arrow to 3D World -->
  <line x1="1340" y1="265" x2="1400" y2="265" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr-s)"/>

  <!-- Global Loop Arc -->
  <path d="M 1480 200 L 1480 60 Q 1480 40 1460 40 L 160 40 Q 140 40 140 60 L 140 115" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arr-s)"/>
  <text x="800" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">Continuous Simulation Loop Frame</text>

  <!-- ══════════════ SYNCHRONIZED MEMORY ══════════════ -->
  <rect x="310" y="530" width="740" height="100" rx="16" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2" filter="url(#shadow)"/>

  <!-- Header row: title left, badge right — both inside card -->
  <text x="500" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#6D28D9" letter-spacing="1px">DISTRIBUTED MEMORY (IndexedDB)</text>
  <!-- Novelty Badge 3 — inside card, top-right corner, fully within bounds -->
  <circle cx="1026" cy="549" r="13" fill="#8B5CF6"/>
  <text x="1026" y="554" text-anchor="middle" class="bdg-txt">3</text>

  <rect x="328" y="565" width="210" height="50" rx="8" fill="#FFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="433" y="585" text-anchor="middle" class="box-txt" fill="#6D28D9">Episodic Stream</text>
  <text x="433" y="603" text-anchor="middle" class="det" fill="#8B5CF6">Recency × Importance × Trust</text>

  <rect x="556" y="565" width="210" height="50" rx="8" fill="#FFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="661" y="585" text-anchor="middle" class="box-txt" fill="#6D28D9">Semantic Graph</text>
  <text x="661" y="603" text-anchor="middle" class="det" fill="#8B5CF6">(S, P, O) Facts + Decay</text>

  <rect x="784" y="565" width="254" height="50" rx="8" fill="#FFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="911" y="585" text-anchor="middle" class="box-txt" fill="#6D28D9">Memory Provenance</text>
  <text x="911" y="603" text-anchor="middle" class="det" fill="#8B5CF6">Direct=1.0 · Peer=0.8 · Infer=0.6</text>

  <!-- Memory Arrows -->
  <line x1="420" y1="465" x2="420" y2="530" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr-p)"/>
  <text x="435" y="495" font-size="11" fill="#8B5CF6" font-weight="600">reads context</text>

  <line x1="680" y1="465" x2="680" y2="530" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr-p)"/>
  <text x="695" y="495" font-size="11" fill="#8B5CF6" font-weight="600">writes facts</text>


  <!-- ══════════════ CALLOUTS ROW ══════════════ -->
  <rect x="40" y="670" width="1500" height="150" rx="16" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="800" y="695" text-anchor="middle" font-size="14" font-weight="800" fill="#92400E" letter-spacing="1.5px">CORE INNOVATIONS</text>

  <!-- Col 1 -->
  <circle cx="85" cy="735" r="14" fill="#0EA5E9"/>
  <text x="85" y="740" text-anchor="middle" class="bdg-txt">1</text>
  <text x="110" y="740" class="callout-em">FOV-Limited Perception</text>
  <text x="110" y="760" class="callout">Agents only perceive what is physically</text>
  <text x="110" y="780" class="callout">visible. Walls structurally block vision,</text>
  <text x="110" y="800" class="callout">eliminating 2D grid omniscience.</text>

  <!-- Col 2 -->
  <circle cx="455" cy="735" r="14" fill="#059669"/>
  <text x="455" y="740" text-anchor="middle" class="bdg-txt">2</text>
  <text x="480" y="740" class="callout-em">Critic Loop Verification</text>
  <text x="480" y="760" class="callout">LLM actions are symbolically validated</text>
  <text x="480" y="780" class="callout">against real 3D state before execution.</text>
  <text x="480" y="800" class="callout">Hallucinations force automatic retry.</text>

  <!-- Col 3 -->
  <circle cx="825" cy="735" r="14" fill="#8B5CF6"/>
  <text x="825" y="740" text-anchor="middle" class="bdg-txt">3</text>
  <text x="850" y="740" class="callout-em">Trust-Weighted Memory Provenance</text>
  <text x="850" y="760" class="callout">Every memory logs its specific source</text>
  <text x="850" y="780" class="callout">with a trust multiplier (Direct > Peer),</text>
  <text x="850" y="800" class="callout">solving the rumour escalation problem.</text>

  <!-- Col 4 -->
  <circle cx="1195" cy="735" r="14" fill="#16A34A"/>
  <text x="1195" y="740" text-anchor="middle" class="bdg-txt">4</text>
  <text x="1220" y="740" class="callout-em">Dual-Path Autonomy</text>
  <text x="1220" y="760" class="callout">A 60fps deterministic subconscious</text>
  <text x="1220" y="780" class="callout">acts as fallback. Agents never freeze</text>
  <text x="1220" y="800" class="callout">while rate-limited conscious LLM runs.</text>

</svg>
