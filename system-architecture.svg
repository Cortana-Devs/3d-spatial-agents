  <line x1="302" y1="163" x2="302" y2="178" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ad)"/>
  <line x1="762" y1="163" x2="762" y2="178" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ad)"/>
  <line x1="1262" y1="163" x2="1262" y2="178" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ad)"/>

