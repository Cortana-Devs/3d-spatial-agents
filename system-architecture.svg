  <text x="1127" y="470" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">IDLE</text>
  <text x="1162" y="470" text-anchor="middle" font-size="10" fill="#D97706">→</text>
  <rect x="1172" y="455" width="55" height="22" rx="11" fill="#FEF3C7"/>
  <text x="1199" y="470" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">NAV</text>
  <text x="1234" y="470" text-anchor="middle" font-size="10" fill="#D97706">→</text>
