  <line x1="652" y1="535" x2="652" y2="700" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="652" y1="700" x2="322" y2="700" stroke="#4F46E5" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="322" y1="700" x2="322" y2="742" stroke="#4F46E5" stroke-width="1.2" marker-end="url(#ai)"/>
  <text x="652" y="696" text-anchor="middle" font-size="9" fill="#818CF8">API request via Web Worker</text>

  <!-- ============ LEGEND ============ -->
  <rect x="60" y="808" width="1480" height="95" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
