  <line x1="110" y1="362" x2="265" y2="362" stroke="#E0F2FE" stroke-width="1"/>
  <text x="110" y="385" class="det" fill="#64748B">• FOV 126° cone</text>
  <text x="110" y="403" class="det" fill="#64748B">• BVH Line-of-Sight</text>
  <text x="110" y="421" class="det" fill="#64748B">• Hearing Bus</text>
  <text x="110" y="439" class="det" fill="#64748B">• 10s Working Memory</text>

