  <rect x="1382" y="468" width="130" height="40" rx="6" fill="#FFF" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="1447" y="485" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6D28D9">Spatial Memory</text>
