  <line x1="285" y1="348" x2="330" y2="348" stroke="#16A34A" stroke-width="1.8" marker-end="url(#ag)"/>

  <rect x="340" y="325" width="220" height="90" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.3"/>
  <text x="450" y="353" text-anchor="middle" class="ttl">Subconscious</text>
