  <rect x="600" y="742" width="400" height="36" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="800" y="765" text-anchor="middle" font-size="13" font-weight="600" fill="#F1F5F9">TTS Web Workers</text>
