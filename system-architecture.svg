  <rect x="1382" y="518" width="130" height="25" rx="6" fill="#FFF" stroke="#C4B5FD" stroke-width="0.8"/>
  <text x="1447" y="535" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6D28D9">Conversation</text>

  <!-- Arrow: Context Mixer ↔ Memory -->
  <line x1="425" y1="535" x2="425" y2="560" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="425" y1="560" x2="1430" y2="560" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="1430" y1="560" x2="1430" y2="543" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="900" y="555" text-anchor="middle" font-size="9" fill="#A78BFA">read memories / write facts</text>

