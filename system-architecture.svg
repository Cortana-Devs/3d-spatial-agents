  <rect x="60" y="265" width="1480" height="310" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.2"/>
  <text x="82" y="287" class="lbl" fill="#4F46E5">AGENT COGNITIVE ARCHITECTURE</text>
