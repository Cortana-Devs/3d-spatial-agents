  <!-- Memory -->
  <rect x="520" y="845" width="14" height="14" rx="3" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="542" y="857" class="legend-txt" font-weight="500">Memory (IndexedDB)</text>

  <!-- Execution -->
  <rect x="680" y="845" width="14" height="14" rx="3" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
