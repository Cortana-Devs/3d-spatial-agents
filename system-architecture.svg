  <rect x="1040" y="742" width="300" height="36" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="1190" y="765" text-anchor="middle" font-size="13" font-weight="600" fill="#F1F5F9">Google Cloud APIs</text>
