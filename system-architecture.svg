  <text x="82" y="88" class="lbl" fill="#3B82F6">PRESENTATION LAYER</text>

  <rect x="82" y="98" width="440" height="55" rx="8" fill="#FFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="302" y="122" text-anchor="middle" class="ttl">Next.js App Shell</text>
  <text x="302" y="140" text-anchor="middle" class="sub">Server Actions · App Router</text>

  <rect x="542" y="98" width="440" height="55" rx="8" fill="#FFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="762" y="122" text-anchor="middle" class="ttl">3D Scene (R3F + Rapier)</text>
  <text x="762" y="140" text-anchor="middle" class="sub">Three.js · Physics · Lighting</text>

  <rect x="1002" y="98" width="520" height="55" rx="8" fill="#FFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="1262" y="122" text-anchor="middle" class="ttl">HUD &amp; Dashboard</text>
  <text x="1262" y="140" text-anchor="middle" class="sub">Chat · Inspector · Minimap · Task Panel</text>

