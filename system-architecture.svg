  <!-- Dual-path annotation -->
  <text x="90" y="880" font-size="10" fill="#94A3B8" font-style="italic">The neuro-symbolic pipeline splits perception into two paths: a deterministic subconscious (60fps) and a rate-limited LLM conscious layer with symbolic verification.</text>
