  <!-- External -->
  <rect x="820" y="845" width="14" height="14" rx="3" fill="#334155" stroke="#475569" stroke-width="1.2"/>
  <text x="842" y="857" class="legend-txt" font-weight="500">External Service</text>

  <!-- Arrow types -->
  <line x1="960" y1="852" x2="990" y2="852" stroke="#16A34A" stroke-width="1.5"/>
